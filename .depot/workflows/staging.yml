name: "depot: staging"

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: depot-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPOT_REGISTRY: kxb4bdmwmg.registry.depot.dev
  STAGING_IMAGE: kxb4bdmwmg.registry.depot.dev/nzh4z2519m/install-scripts

jobs:
  test-go:
    if: github.repository == 'replicatedhq/replicated-installer'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.20"
          cache-dependency-path: util/docker-compose-generate/go.sum
      - run: make -C util/docker-compose-generate test

  test-python:
    if: github.repository == 'replicatedhq/replicated-installer'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpcre2-dev shunit2
          make deps
      - name: Run Python and shell tests
        run: make test

  publish-latitude-staging:
    needs:
      - test-go
      - test-python
    if: github.repository == 'replicatedhq/replicated-installer'
    runs-on: depot-ubuntu-latest
    timeout-minutes: 60
    env:
      LATITUDE_KUBE_DNS_NAME: ${{ secrets.LATITUDE_KUBE_DNS_NAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Check GitOps credentials
        env:
          LATITUDE_GITOPS_DEPLOY_KEY: ${{ secrets.LATITUDE_GITOPS_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$LATITUDE_GITOPS_DEPLOY_KEY" ]]; then
            echo "LATITUDE_GITOPS_DEPLOY_KEY is required" >&2
            exit 1
          fi
      - uses: depot/setup-action@v1
      - name: Log in to Depot Registry
        run: printf '%s' "$DEPOT_TOKEN" | docker login "$DEPOT_REGISTRY" --username x-token --password-stdin
      - name: Set image tag
        id: version
        run: echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build and push install-scripts
        uses: depot/build-push-action@v1
        with:
          project: nzh4z2519m
          context: .
          file: deploy/Dockerfile.prod
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.STAGING_IMAGE }}:${{ steps.version.outputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Install Kustomize
        run: go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
      - name: Render Latitude staging
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          cd kustomize/overlays/latitude-staging
          kustomize edit set image "replicated/install-scripts=${STAGING_IMAGE}:${VERSION}"
          kustomize build . > "$RUNNER_TEMP/install-scripts.yaml"
          grep -Fq "image: ${STAGING_IMAGE}:${VERSION}" "$RUNNER_TEMP/install-scripts.yaml"
      - name: Install Flux CLI
        uses: fluxcd/flux2/action@v2.8.7
        with:
          version: "2.8.7"
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.7"
      - name: Connect to Tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: Configure Latitude staging access
        timeout-minutes: 5
        run: |
          set -euo pipefail
          umask 077
          export KUBECONFIG="$RUNNER_TEMP/latitude-staging.kubeconfig"
          latitude_ip="$(tailscale status --json | jq -er --arg dns_name "${LATITUDE_KUBE_DNS_NAME}." '
            first(.Peer[] | select(.DNSName == $dns_name) | .TailscaleIPs[] | select(contains(":") | not))
          ')"
          kubectl config set-cluster latitude-staging \
            --server="https://${latitude_ip}" --tls-server-name="$LATITUDE_KUBE_DNS_NAME"
          kubectl config set-credentials tailscale-auth --token=unused
          kubectl config set-context latitude-staging --cluster=latitude-staging --user=tailscale-auth
          kubectl config use-context latitude-staging

          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
      - name: Check out Latitude GitOps
        uses: actions/checkout@v6
        with:
          repository: replicatedhq/gitops-deploy
          ref: main
          path: gitops-deploy
          ssh-key: ${{ secrets.LATITUDE_GITOPS_DEPLOY_KEY }}
      - name: Publish Latitude staging manifest
        working-directory: gitops-deploy
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          manifest=staging/applications/install-scripts.yaml
          grep -Eq '^[[:space:]]*-[[:space:]]+(\./)?install-scripts\.yaml[[:space:]]*$' staging/applications/kustomization.yaml
          cp "$RUNNER_TEMP/install-scripts.yaml" "$manifest"
          kustomize build staging/applications > /dev/null
          git add -- "$manifest"
          if git diff --cached --quiet; then
            echo "Latitude install-scripts manifest is already current."
            exit 0
          fi
          git config user.name replicated-ci
          git config user.email replicated-ci@users.noreply.github.com
          git commit -m "Update Latitude install-scripts to ${VERSION}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            kustomize build staging/applications > /dev/null
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo "Failed to publish Latitude install-scripts after five attempts" >&2
          exit 1
      - name: Reconcile Latitude staging
        timeout-minutes: 12
        run: |
          set -euo pipefail
          # applications has wait: true, so this also waits for its health checks.
          flux reconcile kustomization applications \
            --namespace flux-system --with-source --timeout=10m
      - name: Verify install-scripts rollout
        timeout-minutes: 12
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          expected_image="${STAGING_IMAGE}:${VERSION}"
          assert_image() {
            local actual_image
            actual_image="$(kubectl --request-timeout=30s -n default get deployment/install-scripts \
              -o 'jsonpath={.spec.template.spec.containers[?(@.name=="install-scripts")].image}')"
            if [[ "$actual_image" != "$expected_image" ]]; then
              echo "install-scripts has image '$actual_image'; expected '$expected_image'" >&2
              return 1
            fi
          }
          assert_image
          kubectl -n default rollout status deployment/install-scripts --timeout=10m
          # A concurrent publisher must not replace our image while we watch the rollout.
          assert_image
